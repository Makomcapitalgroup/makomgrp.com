# Panel administrativo de MAKOM CAPITAL GROUP — Decap CMS
#
# backend.name se mantiene en "github" (forma definitiva de producción).
# local_backend:true es inerte en producción (solo se activa si Decap
# detecta un proxy decap-server corriendo en localhost/127.0.0.1) — ver
# packages/decap-cms-core/src/actions/config.ts (handleLocalBackend) en
# el código fuente oficial de Decap CMS. Esto permite probar el panel
# localmente sin OAuth, sin necesitar un segundo archivo de configuración
# ni tocar nada para cuando se conecte el OAuth real (Milestone 10).
#
# Milestone 10: base_url/auth_endpoint son propiedades de "backend"
# (deben anidarse ahí — confirmado contra la documentación actual de
# Decap, decapcms.org/docs/backends-overview/: "these are properties of
# the backend field, and should be nested under that field"). Apuntan
# al Cloudflare Worker que hace de proxy OAuth (Milestone 10, Etapa 2/3A)
# — ya probado end-to-end manualmente contra GitHub. Ninguno de los dos
# valores es secreto: son la URL pública del Worker y una ruta fija:
# el Client Secret nunca vive aquí, solo en el propio Worker.
backend:
  name: github
  repo: Makomcapitalgroup/makomgrp.com
  branch: main
  base_url: https://makom-cms-auth.gerencia-a34.workers.dev
  auth_endpoint: auth

local_backend: true

publish_mode: simple
locale: "es"

# Milestone 12 — Etapa 4: biblioteca de medios ÚNICA y compartida
# (Decap exige media_folder/public_folder GLOBAL). La colección
# "propiedades" ya no declara media_folder/public_folder propios —
# ver el comentario junto a "fields:" para el porqué.
media_folder: "assets/propiedades/uploads"
public_folder: "/assets/propiedades/uploads"

collections:
  - name: "propiedades"
    label: "Propiedades"
    label_singular: "Propiedad"
    description: "Propiedades administradas por MAKOM CAPITAL GROUP."
    folder: "content/propiedades"
    create: true
    slug: "{{slug}}"
    format: "json"
    extension: "json"
    identifier_field: "titulo"
    summary: "{{titulo}} — {{estado}}"
    editor:
      preview: false
    # Milestone 12 — Etapa 4: se revirtió la carpeta de medios por
    # propiedad ("{{slug}}", a nivel de colección y de field) — el
    # field anidado no la heredaba y, cuando sí se declaraba en el
    # field, Decap resolvía "{{slug}}" re-sluggificando el título
    # ACTUAL en cada subida en vez del slug congelado de la entrada
    # (bug conocido: decaporg/decap-cms#5444). Toda subida nueva usa
    # ahora la biblioteca GLOBAL de arriba. Las 5 fotos existentes en
    # assets/propiedades/ph-mi-condado/ no se tocan; sus rutas siguen
    # siendo válidas.
    fields:
      # ---------------------------------------------------------
      # 1. INFORMACIÓN BÁSICA
      # ---------------------------------------------------------
      - label: "Título"
        name: "titulo"
        widget: "string"
        hint: "Nombre público de la propiedad. Ej.: Apartamento en Punta Pacífica"

      - label: "Título en inglés"
        name: "tituloEn"
        widget: "string"
        required: false
        hint: "Se usa en /en/. Si se deja vacío, la ficha en inglés muestra el Título en español mientras se traduce."

      - label: "Operación"
        name: "operacion"
        widget: "select"
        options:
          - { label: "Venta", value: "venta" }
          - { label: "Alquiler", value: "alquiler" }

      - label: "Fecha de entrega"
        name: "fechaEntrega"
        widget: "select"
        options:
          - { label: "Inmediata", value: "inmediata" }
          - { label: "Futura", value: "futura" }

      - label: "Tipo de propiedad"
        name: "tipo"
        widget: "select"
        options:
          - { label: "Apartamento", value: "apartamento" }
          - { label: "Casa", value: "casa" }
          - { label: "Penthouse", value: "penthouse" }
          - { label: "Oficina", value: "oficina" }
          - { label: "Local comercial", value: "local-comercial" }
          - { label: "Terreno", value: "terreno" }
          - { label: "Bodega", value: "bodega" }
          - { label: "Edificio", value: "edificio" }
          - { label: "PH", value: "ph" }
          - { label: "Otro", value: "otro" }

      - label: "Categoría general"
        name: "categoriaGeneral"
        widget: "select"
        options:
          - { label: "Residencial", value: "residencial" }
          - { label: "Comercial", value: "comercial" }
          - { label: "Terreno", value: "terreno" }
          - { label: "Otro", value: "otro" }

      - label: "Estado"
        name: "estado"
        widget: "select"
        default: "borrador"
        options:
          - { label: "Borrador", value: "borrador" }
          - { label: "Disponible", value: "disponible" }
          - { label: "Reservada", value: "reservada" }
          - { label: "Vendida", value: "vendida" }
          - { label: "Alquilada", value: "alquilada" }
          - { label: "Archivada", value: "archivada" }
        hint: "Solo Disponible y Reservada aparecen públicamente en /propiedades/."

      - label: "Descripción"
        name: "descripcion"
        widget: "richtext"
        buttons: ["bold", "italic", "bulleted-list", "numbered-list"]
        hint: "Editor visual — no es necesario escribir Markdown a mano."

      - label: "Descripción en inglés"
        name: "descripcionEn"
        widget: "richtext"
        buttons: ["bold", "italic", "bulleted-list", "numbered-list"]
        required: false
        hint: "Se usa en /en/. Si se deja vacía, la ficha en inglés muestra la Descripción en español mientras se traduce."

      # ---------------------------------------------------------
      # 2. PRECIO
      # ---------------------------------------------------------
      - label: "Precio"
        name: "precio"
        widget: "object"
        collapsed: false
        fields:
          - label: "Monto"
            name: "monto"
            widget: "number"
            value_type: "int"
            min: 0
          - label: "Moneda"
            name: "moneda"
            widget: "select"
            default: "USD"
            options:
              - { label: "USD", value: "USD" }
          - label: "Periodicidad"
            name: "periodicidad"
            widget: "select"
            required: false
            hint: "Solo aplica a propiedades en Alquiler. Deje vacío en Venta."
            options:
              - { label: "Mensual", value: "mensual" }
              - { label: "Quincenal", value: "quincenal" }
              - { label: "Otra", value: "otra" }
          - label: "Fecha de referencia del precio"
            name: "fechaReferencia"
            widget: "datetime"
            format: "YYYY-MM"
            date_format: "MM/YYYY"
            time_format: false
            required: false
            hint: "Mes y año en que MAKOM confirmó el precio de lista (ej. 11/2026). Si se llena, la ficha muestra debajo del precio: «Precio de lista a [mes] [año] · sujeto a disponibilidad». Déjelo vacío si no está confirmado: el sitio nunca inventa una fecha."
          - label: "Precios específicos (opcional)"
            name: "preciosEspecificos"
            widget: "list"
            required: false
            collapsed: true
            label_singular: "Precio específico"
            summary: "{{fields.etiqueta}} — desde {{fields.monto}}"
            hint: "Para modelos con precio propio, ej. «2 recámaras» desde $X. Solo con datos confirmados por MAKOM. Se muestra bajo el precio como «2 recámaras desde $X»."
            fields:
              - { label: "Etiqueta (ES)", name: "etiqueta", widget: "string", hint: "Ej.: 2 recámaras" }
              - { label: "Etiqueta (EN)", name: "etiquetaEn", widget: "string", required: false, hint: "Ej.: 2 bedrooms. Si se deja vacía se usa la de español." }
              - { label: "Monto desde (USD)", name: "monto", widget: "number", value_type: "int", min: 0 }

      # ---------------------------------------------------------
      # 3. UBICACIÓN
      # ---------------------------------------------------------
      - label: "Ubicación administrativa (uso interno)"
        name: "ubicacionInterna"
        widget: "object"
        collapsed: false
        hint: "Estos datos NUNCA se muestran públicamente en el sitio."
        fields:
          - { label: "Provincia", name: "provincia", widget: "string" }
          - { label: "Distrito", name: "distrito", widget: "string" }
          - { label: "Corregimiento", name: "corregimiento", widget: "string", required: false }
          - { label: "Sector / Área", name: "sector", widget: "string" }
          - { label: "Edificio / PH", name: "edificioPH", widget: "string", required: false }
          - label: "Dirección interna"
            name: "direccionInterna"
            widget: "string"
            required: false
            hint: "La dirección interna NO se muestra públicamente."

      - label: "Ubicación pública"
        name: "ubicacionPublica"
        widget: "string"
        hint: "Este es el texto que verá el visitante del sitio. Ej.: Punta Pacífica, Ciudad de Panamá"

      - label: "Ubicación pública en inglés"
        name: "ubicacionPublicaEn"
        widget: "string"
        required: false
        hint: "Se usa en /en/. Si se deja vacía, la ficha en inglés muestra la Ubicación pública en español mientras se traduce."

      # Zona para el buscador (filtro "Ubicación"). Las opciones se
      # derivan de _data/propiedadesConfig.json (claves "regiones" y
      # "zonas"); el build verifica que ambas listas coincidan (ver
      # scripts/verificar-zonas.js). Si se agrega o cambia una zona, hay
      # que actualizar los dos archivos a la vez.
      - label: "Zona (para el buscador)"
        name: "zona"
        widget: "select"
        required: false
        hint: "Solo sirve para el filtro de ubicación del buscador. No cambia lo que se muestra en la ficha. Elíjala únicamente si la 'Ubicación pública' lo indica claramente; si hay duda, déjela vacía. No la deduzca de la ubicación administrativa interna."
        options:
          - { label: "Ciudad de Panamá › Albrook", value: "albrook" }
          - { label: "Ciudad de Panamá › Amador", value: "amador" }
          - { label: "Ciudad de Panamá › Bella Vista", value: "bella-vista" }
          - { label: "Ciudad de Panamá › Betania", value: "betania" }
          - { label: "Ciudad de Panamá › Coco del Mar", value: "coco-del-mar" }
          - { label: "Ciudad de Panamá › Condado del Rey", value: "condado-del-rey" }
          - { label: "Ciudad de Panamá › Edison Park", value: "edison-park" }
          - { label: "Ciudad de Panamá › El Cangrejo", value: "el-cangrejo" }
          - { label: "Ciudad de Panamá › Green City", value: "green-city" }
          - { label: "Ciudad de Panamá › Los Ángeles", value: "los-angeles" }
          - { label: "Ciudad de Panamá › Obarrio", value: "obarrio" }
          - { label: "Ciudad de Panamá › Tumba Muerto", value: "tumba-muerto" }
          - { label: "Ciudad de Panamá › Vía España", value: "via-espana" }
          - { label: "Ciudad de Panamá › Otras zonas de Ciudad de Panamá", value: "ciudad-de-panama-general" }
          - { label: "Panamá Oeste › Arraiján", value: "arraijan" }
          - { label: "Panamá Oeste › La Chorrera", value: "la-chorrera" }
          - { label: "Panamá Oeste › Capira", value: "capira" }

      # ---------------------------------------------------------
      # 4. DETALLES DE LA PROPIEDAD
      # ---------------------------------------------------------
      - label: "Detalles cuantitativos"
        name: "detallesCuantitativos"
        widget: "object"
        collapsed: false
        fields:
          - { label: "Habitaciones", name: "habitaciones", widget: "number", value_type: "int", min: 0, required: false }
          - { label: "Baños", name: "banos", widget: "number", value_type: "float", step: 0.5, min: 0, required: false }
          - { label: "Estacionamientos", name: "estacionamientos", widget: "number", value_type: "int", min: 0, required: false }
          - { label: "Metraje interno (m²)", name: "metrajeInterno", widget: "number", value_type: "float", min: 0, required: false }
          - { label: "Metraje total (m²)", name: "metrajeTotal", widget: "number", value_type: "float", min: 0, required: false }
          - { label: "Año de construcción", name: "anoConstruccion", widget: "number", value_type: "int", required: false }
          - { label: "Piso", name: "piso", widget: "string", required: false, hint: "Puede ser un número o texto (ej. PB, Ático)." }
          - { label: "Habitaciones — máximo (rango)", name: "habitacionesMaximo", widget: "number", value_type: "int", min: 0, required: false, hint: "Solo si la oferta incluye varias tipologías. Ej.: Habitaciones = 1 y este campo = 2 → la ficha muestra «1–2». No escriba un valor sin confirmarlo." }
          - { label: "Habitaciones — mostrar «Desde N»", name: "habitacionesDesde", widget: "boolean", default: false, required: false, hint: "Muestra «Desde 1» (en vez de «1») cuando existen más tipologías sin un máximo confirmado." }
          - { label: "Baños — máximo (rango)", name: "banosMaximo", widget: "number", value_type: "float", step: 0.5, min: 0, required: false, hint: "Ej.: Baños = 1 y este campo = 2 → «1–2»." }
          - { label: "Baños — mostrar «Desde N»", name: "banosDesde", widget: "boolean", default: false, required: false }

      - label: "Detalles de la propiedad"
        name: "detalles"
        widget: "select"
        multiple: true
        required: false
        hint: "Seleccione todo lo que aplique."
        options:
          - { label: "Cuarto de empleada", value: "cuarto-empleada" }
          - { label: "Baño de empleada", value: "bano-empleada" }
          - { label: "Depósito", value: "deposito" }
          - { label: "Área de lavandería", value: "lavanderia" }
          - { label: "Balcón", value: "balcon" }
          - { label: "Terraza", value: "terraza" }
          - { label: "Jardín", value: "jardin" }
          - { label: "Den", value: "den" }
          - { label: "Estudio", value: "estudio" }
          - { label: "Sala familiar", value: "sala-familiar" }
          - { label: "Walk-in closet", value: "walk-in-closet" }
          - { label: "Cocina abierta", value: "cocina-abierta" }
          - { label: "Cocina cerrada", value: "cocina-cerrada" }
          - { label: "Línea blanca", value: "linea-blanca" }
          - { label: "Amoblado", value: "amoblado" }
          - { label: "Aires acondicionados", value: "aires-acondicionados" }
          - { label: "Vista al mar", value: "vista-mar" }
          - { label: "Vista a la ciudad", value: "vista-ciudad" }
          - { label: "Vista al parque", value: "vista-parque" }
          - { label: "Frente al mar", value: "frente-mar" }
          - { label: "Piso alto", value: "piso-alto" }
          - { label: "Acceso directo al elevador", value: "acceso-directo-elevador" }

      # ---------------------------------------------------------
      # 5. CARACTERÍSTICAS / AMENIDADES
      # ---------------------------------------------------------
      - label: "Características / Amenidades"
        name: "amenidades"
        widget: "select"
        multiple: true
        required: false
        hint: "Seleccione todo lo que aplique."
        options:
          - { label: "Piscina", value: "piscina" }
          - { label: "Gimnasio", value: "gimnasio" }
          - { label: "Lobby", value: "lobby" }
          - { label: "Seguridad 24/7", value: "seguridad-24-7" }
          - { label: "Garita de seguridad", value: "garita-seguridad" }
          - { label: "Acceso controlado", value: "acceso-controlado" }
          - { label: "Cerradura digital", value: "cerradura-digital" }
          - { label: "Elevadores", value: "elevadores" }
          - { label: "Elevador de servicio", value: "elevador-servicio" }
          - { label: "Planta eléctrica", value: "planta-electrica" }
          - { label: "Planta eléctrica total", value: "planta-electrica-total" }
          - { label: "Tanque de reserva", value: "tanque-reserva" }
          - { label: "Área social", value: "area-social" }
          - { label: "Salón de eventos", value: "salon-eventos" }
          - { label: "Coworking", value: "coworking" }
          - { label: "Parque infantil", value: "parque-infantil" }
          - { label: "Cancha deportiva", value: "cancha-deportiva" }
          - { label: "Rooftop", value: "rooftop" }
          - { label: "Área BBQ", value: "bbq" }
          - { label: "Pet friendly", value: "pet-friendly" }
          - { label: "Estacionamientos de visitas", value: "estacionamientos-visitas" }
          - { label: "Estacionamientos techados", value: "estacionamientos-techados" }
          - { label: "Cargador para vehículo eléctrico", value: "cargador-electrico" }
          - { label: "Concierge", value: "concierge" }
          - { label: "Administración en sitio", value: "administracion-sitio" }
          - { label: "Acceso para personas con movilidad reducida", value: "accesibilidad" }
          - { label: "Lounge social", value: "lounge-social" }
          - { label: "Área de scooter", value: "area-scooter" }

      # ---------------------------------------------------------
      # 6. FOTOGRAFÍAS
      # ---------------------------------------------------------
      - label: "Fotografías"
        name: "fotografias"
        widget: "object"
        collapsed: false
        fields:
          - label: "Galería"
            name: "galeria"
            widget: "list"
            required: false
            min: 3
            max: 6
            collapsed: true
            summary: "{{fields.archivo}}"
            label_singular: "Fotografía"
            hint: >
              Suba entre 3 y 6 fotografías. Arrastre para reordenar; la
              primera se usa como portada salvo que marque otra distinta.
              La foto principal debería medir 1600 px de ancho o más: el
              sitio nunca amplía una imagen pequeña, así que una foto de
              baja resolución se verá borrosa (el build avisa de ellas).
              Si por error pulsa "Añadir Fotografía" y queda un elemento
              sin archivo, use el ícono de la papelera de ese elemento
              para eliminarlo antes de publicar.
            fields:
              - { label: "Archivo", name: "archivo", widget: "image" }
              - label: "Texto alternativo"
                name: "alt"
                widget: "string"
                required: false
                hint: "Si se deja vacío, se genera automáticamente a partir del título y la ubicación."
              - { label: "Usar como portada", name: "portada", widget: "boolean", default: false }

      # ---------------------------------------------------------
      # 7. MAPA
      #
      # Milestone 8 — investigado antes de construir: el widget nativo
      # "map" de Decap CMS guarda un string GeoJSON (no compatible con
      # nuestros campos latitud/longitud ya aprobados) y NO incluye
      # buscador de direcciones — solo un mapa en blanco para hacer
      # clic. Construir un widget custom con Nominatim embebido en el
      # propio formulario de Decap habría exigido registrar un
      # componente React dentro del CMS — la clase de "interfaz frágil"
      # que se pidió evitar. En su lugar: campos numéricos simples +
      # una herramienta auxiliar (admin/buscar-ubicacion.html, fuera
      # del formulario) donde Loyra/Yurlio buscan la dirección una vez
      # y copian el resultado — sin escribir ni calcular coordenadas
      # de memoria.
      # ---------------------------------------------------------
      - label: "Video del recorrido"
        name: "videoRecorrido"
        widget: "object"
        collapsed: true
        required: false
        hint: "Opcional. Aparece como la ficha «Video» junto a las miniaturas de la galería. Use un enlace (YouTube, Vimeo o un .mp4 público) o suba un archivo; si completa ambos, se usa el enlace."
        fields:
          - { label: "Enlace del video", name: "url", widget: "string", required: false, hint: "Ej.: https://www.youtube.com/watch?v=… o https://vimeo.com/… o la URL pública de un .mp4. Solo https." }
          - { label: "Archivo de video (.mp4 / .webm)", name: "archivo", widget: "file", required: false, hint: "Los archivos se guardan en el repositorio: manténgalos por debajo de 25 MB. Para videos largos prefiera un enlace." }
          - { label: "Imagen de portada del video", name: "poster", widget: "image", required: false, hint: "Opcional. Se muestra antes de reproducir un archivo de video." }
          - { label: "Título accesible", name: "titulo", widget: "string", required: false, hint: "Ej.: Recorrido por el apartamento modelo. Si se deja vacío se usa «Video del recorrido»." }

      - label: "Planos"
        name: "planos"
        widget: "list"
        required: false
        collapsed: true
        label_singular: "Plano"
        summary: "{{fields.etiqueta}} {{fields.archivo}}"
        hint: "Opcional. Aparece como la ficha «Planos» junto a las miniaturas. Suba imágenes (JPG/PNG)."
        fields:
          - { label: "Archivo", name: "archivo", widget: "image" }
          - { label: "Etiqueta (ES)", name: "etiqueta", widget: "string", required: false, hint: "Ej.: Modelo A — 1 recámara" }
          - { label: "Etiqueta (EN)", name: "etiquetaEn", widget: "string", required: false }

      - label: "Asesor asignado"
        name: "asesor"
        widget: "relation"
        collection: "asesores"
        search_fields: ["nombre"]
        value_field: "{{slug}}"
        display_fields: ["nombre"]
        required: false
        hint: "Opcional. La tarjeta de contacto muestra su foto o monograma, nombre, cargo, número de idoneidad (si lo tiene) y un botón de WhatsApp a SU número. Sin asesor, se usa el contacto corporativo de MAKOM. Los perfiles se crean en la sección «Asesores»."

      - label: "Enlace limpio (opcional)"
        name: "slugPublico"
        widget: "string"
        required: false
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Solo minúsculas, números y guiones simples (sin tildes, espacios ni guiones largos)."]
        hint: "Ej.: apartamentos-santo-tomas-mkw-re-020. Sin tildes, sin guion largo y sin el precio. Si se llena, ESA es la dirección pública de la ficha y la dirección anterior (la del nombre del archivo) queda redirigida. No lo cambie en propiedades ya compartidas sin avisar a desarrollo."

      - label: "Mapa"
        name: "mapa"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - label: "Mostrar mapa"
            name: "activo"
            widget: "boolean"
            default: false
            hint: "Desactivado por defecto. Actívelo solo si MAKOM decide mostrar la ubicación aproximada de esta propiedad."
          - label: "Precisión"
            name: "precision"
            widget: "select"
            default: "aproximada"
            options:
              - { label: "Aproximada (zona)", value: "aproximada" }
            hint: "El sitio público siempre muestra una zona aproximada (un círculo), nunca un marcador ni la ubicación exacta: el centro del círculo se desplaza a propósito respecto al punto que usted escribe abajo. La opción «Exacta» se retiró por política (ver la ficha de cada propiedad para confirmar)."
          - label: "Latitud"
            name: "latitud"
            widget: "number"
            value_type: "float"
            required: false
            hint: "Abra /admin/buscar-ubicacion.html en otra pestaña, busque la ZONA (no la dirección exacta del edificio) y copie aquí el número. IMPORTANTE: el repositorio del sitio es público, así que escriba siempre un punto aproximado del sector: lo que se guarda aquí puede verse en GitHub aunque la página muestre solo un círculo."
          - label: "Longitud"
            name: "longitud"
            widget: "number"
            value_type: "float"
            required: false
          - label: "Nivel de zoom"
            name: "nivelZoom"
            widget: "number"
            value_type: "int"
            default: 15
            required: false
            hint: "Opcional. 15 es un buen acercamiento de sector/barrio."

      # ---------------------------------------------------------
      # 8. PUBLICACIÓN
      # ---------------------------------------------------------
      - label: "Mostrar en página principal"
        name: "mostrarEnHome"
        widget: "boolean"
        default: false
        hint: "MAKOM mostrará un máximo de 3 propiedades destacadas."

      - label: "Orden en Home"
        name: "ordenHome"
        widget: "number"
        value_type: "int"
        required: false
        hint: "Opcional. Si varias propiedades están destacadas, decide cuál aparece primero."

      # ---------------------------------------------------------
      # 9. SEO AVANZADO (siempre al final, siempre opcional)
      # ---------------------------------------------------------
      - label: "SEO avanzado"
        name: "seo"
        widget: "object"
        collapsed: true
        required: false
        hint: "Opcional — el sitio genera automáticamente estos valores si se dejan vacíos."
        fields:
          - { label: "Título SEO", name: "titulo", widget: "string", required: false }
          - { label: "Descripción SEO", name: "descripcion", widget: "text", required: false }
          - { label: "Descripción SEO en inglés", name: "descripcionEn", widget: "text", required: false, hint: "Se usa en /en/. Si se deja vacía, se genera a partir de la descripción en inglés (nunca se reutiliza el texto en español)." }
          - { label: "Imagen social", name: "imagenSocial", widget: "image", required: false, hint: "Imagen para WhatsApp, Facebook y otras redes. Ideal: 1200 × 630 px. Si se deja vacía se usa la portada de la galería (recortada a 1200 × 630 solo si tiene el tamaño suficiente; nunca se amplía)." }
          - { label: "No indexar (noindex)", name: "noIndex", widget: "boolean", default: false }

      # ---------------------------------------------------------
      # CAMPOS TÉCNICOS — nunca visibles para Loyra/Yurlio.
      # Ver Milestone 6, sección "Campos automáticos" del reporte
      # para la clasificación y el porqué de cada uno.
      # ---------------------------------------------------------
      - label: "Referencia MAKOM"
        name: "referenciaMakom"
        widget: "string"
        default: "PENDIENTE-ASIGNACION"
        hint: "Se asigna automáticamente al publicar. No editar manualmente."

      # "metadatos" se declara como grupo anidado (no campos sueltos)
      # para calzar con el modelo aprobado en el Milestone 2, donde
      # las plantillas leen propiedad.metadatos.fechaCreacion, etc.
      #
      # Sin "default" en ninguno de los tres: se comprobó en la prueba
      # local de este milestone que el valor dinámico "{{now}}" NO se
      # interpola de forma fiable en un widget hidden (se guarda el
      # texto literal "{{now}}") — el mismo tipo de limitación ya
      # documentada para "{{slug}}" (decaporg/decap-cms#4022, #4787).
      # Los tres quedan vacíos hasta que un script/hook posterior
      # (Milestone 11) los asigne. Se declaran igual como campos
      # "hidden" (en vez de omitirlos del todo) para que Decap CMS
      # conserve ese valor futuro en cada guardado posterior — con
      # format: "json", cualquier clave NO declarada en "fields" se
      # descarta silenciosamente al guardar.
      - label: "Metadatos (interno)"
        name: "metadatos"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - { label: "Fecha de creación", name: "fechaCreacion", widget: "hidden", required: false }
          - { label: "Fecha de publicación", name: "fechaPublicacion", widget: "hidden", required: false }
          - { label: "Fecha de actualización", name: "fechaActualizacion", widget: "hidden", required: false }

  # ============================================================
  # Milestone 14 — Etapa 1: colección Proyectos. Reutiliza la MISMA
  # biblioteca de medios global (no declara media_folder/public_folder
  # propios — hereda el de arriba) por la misma razón ya documentada
  # para "propiedades": no usar "{{slug}}" en media_folder evita el bug
  # conocido de Decap (decaporg/decap-cms#5444).
  # ============================================================
  - name: "proyectos"
    label: "Proyectos"
    label_singular: "Proyecto"
    description: "Proyectos de MAKOM Development."
    folder: "content/proyectos"
    create: true
    slug: "{{slug}}"
    format: "json"
    extension: "json"
    identifier_field: "titulo"
    summary: "{{titulo}} — {{estado}}"
    editor:
      preview: false
    fields:
      - label: "Título"
        name: "titulo"
        widget: "string"
        hint: "Ej.: Remodelación Integral · San Francisco"

      - label: "Título en inglés"
        name: "tituloEn"
        widget: "string"
        required: false
        hint: "Se usa en /en/projects/. Si se deja vacío, la versión en inglés muestra este Título en español mientras se traduce."

      - label: "Estado"
        name: "estado"
        widget: "select"
        default: "proximo"
        options:
          - { label: "Próximo", value: "proximo" }
          - { label: "En desarrollo", value: "en_desarrollo" }
          - { label: "Completado", value: "completado" }
        hint: "\"Próximo\" muestra la etiqueta \"Próximamente\" en las tarjetas."

      - label: "Tipo de proyecto"
        name: "tipoProyecto"
        widget: "string"
        required: false
        hint: "Ej.: Remodelación Integral, Gestión de Portafolio, Desarrollo Residencial."

      - label: "Ubicación"
        name: "ubicacion"
        widget: "string"
        required: false
        hint: "Ej.: San Francisco, Ciudad de Panamá"

      - label: "Ubicación en inglés"
        name: "ubicacionEn"
        widget: "string"
        required: false

      - label: "Año"
        name: "ano"
        widget: "number"
        value_type: "int"
        required: false

      - label: "Extracto"
        name: "extracto"
        widget: "text"
        hint: "Resumen corto para la tarjeta (Home y listado)."

      - label: "Extracto en inglés"
        name: "extractoEn"
        widget: "text"
        required: false

      - label: "Descripción"
        name: "descripcion"
        widget: "richtext"
        buttons: ["bold", "italic", "bulleted-list", "numbered-list"]
        required: false
        hint: "Texto completo para la ficha del proyecto. Editor visual — no es necesario escribir Markdown a mano."

      - label: "Descripción en inglés"
        name: "descripcionEn"
        widget: "richtext"
        buttons: ["bold", "italic", "bulleted-list", "numbered-list"]
        required: false

      - label: "Imagen principal"
        name: "imagenPrincipal"
        widget: "image"
        required: false

      - label: "Galería"
        name: "galeria"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.archivo}}"
        label_singular: "Fotografía"
        fields:
          - { label: "Archivo", name: "archivo", widget: "image" }
          - { label: "Texto alternativo", name: "alt", widget: "string", required: false }

      - label: "CTA — Texto"
        name: "ctaTexto"
        widget: "string"
        required: false
        hint: "Si se deja vacío, se usa \"Ver proyecto\" por defecto."

      - label: "CTA — Texto en inglés"
        name: "ctaTextoEn"
        widget: "string"
        required: false

      - label: "CTA — Enlace"
        name: "ctaUrl"
        widget: "string"
        required: false
        hint: "Si se deja vacío, enlaza a la ficha del proyecto (/proyectos/<slug>/)."

      - label: "Mostrar en página principal"
        name: "mostrarEnHome"
        widget: "boolean"
        default: false
        hint: "MAKOM mostrará un máximo de 3 proyectos destacados."

      - label: "Orden en Home"
        name: "ordenHome"
        widget: "number"
        value_type: "int"
        required: false

      - label: "SEO avanzado"
        name: "seo"
        widget: "object"
        collapsed: true
        required: false
        hint: "Opcional — el sitio genera automáticamente estos valores si se dejan vacíos."
        fields:
          - { label: "Título SEO", name: "titulo", widget: "string", required: false }
          - { label: "Título SEO en inglés", name: "tituloEn", widget: "string", required: false }
          - { label: "Descripción SEO", name: "descripcion", widget: "text", required: false }
          - { label: "Descripción SEO en inglés", name: "descripcionEn", widget: "text", required: false }
          - { label: "No indexar (noindex)", name: "noIndex", widget: "boolean", default: false }

  # ============================================================
  # Milestone 14 — Etapa 1: colección Perspectivas (artículos /
  # insights editoriales). Misma biblioteca de medios global que
  # Propiedades y Proyectos.
  # ============================================================
  - name: "perspectivas"
    label: "Perspectivas"
    label_singular: "Perspectiva"
    description: "Artículos e insights de MAKOM CAPITAL GROUP."
    folder: "content/perspectivas"
    create: true
    slug: "{{slug}}"
    format: "json"
    extension: "json"
    identifier_field: "titulo"
    summary: "{{titulo}} — {{fecha}}"
    editor:
      preview: false
    fields:
      - label: "Título"
        name: "titulo"
        widget: "string"

      - label: "Título en inglés"
        name: "tituloEn"
        widget: "string"
        required: false
        hint: "Se usa en /en/insights/. Si se deja vacío, la versión en inglés muestra este Título en español mientras se traduce."

      - label: "Fecha"
        name: "fecha"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false
        hint: "Opcional. Completar cuando el artículo tenga una fecha real de publicación."

      - label: "Autor"
        name: "autor"
        widget: "string"
        default: "MAKOM CAPITAL GROUP"

      - label: "Categoría"
        name: "categoria"
        widget: "string"
        hint: "Ej.: Mercado, Inversión."

      - label: "Extracto"
        name: "extracto"
        widget: "text"
        hint: "Resumen corto para la tarjeta (Home y listado)."

      - label: "Extracto en inglés"
        name: "extractoEn"
        widget: "text"
        required: false

      - label: "Contenido"
        name: "contenido"
        widget: "richtext"
        buttons: ["bold", "italic", "bulleted-list", "numbered-list"]
        hint: "Editor visual — no es necesario escribir Markdown a mano."

      - label: "Contenido en inglés"
        name: "contenidoEn"
        widget: "richtext"
        buttons: ["bold", "italic", "bulleted-list", "numbered-list"]
        required: false

      - label: "Imagen de portada"
        name: "imagenPortada"
        widget: "image"
        required: false

      - label: "Mostrar en página principal"
        name: "mostrarEnHome"
        widget: "boolean"
        default: false
        hint: "MAKOM mostrará un máximo de 4 perspectivas destacadas."

      - label: "Orden en Home"
        name: "ordenHome"
        widget: "number"
        value_type: "int"
        required: false

      - label: "SEO avanzado"
        name: "seo"
        widget: "object"
        collapsed: true
        required: false
        hint: "Opcional — el sitio genera automáticamente estos valores si se dejan vacíos."
        fields:
          - { label: "Título SEO", name: "titulo", widget: "string", required: false }
          - { label: "Título SEO en inglés", name: "tituloEn", widget: "string", required: false }
          - { label: "Descripción SEO", name: "descripcion", widget: "text", required: false }
          - { label: "Descripción SEO en inglés", name: "descripcionEn", widget: "text", required: false }
          - { label: "No indexar (noindex)", name: "noIndex", widget: "boolean", default: false }

  # ---------------------------------------------------------------
  # Asesores: perfiles reutilizables que se asignan a cada propiedad
  # (campo "Asesor asignado"). Los datos son SOLO los que MAKOM
  # confirme: el sitio nunca inventa nombres, números ni idoneidades.
  # ---------------------------------------------------------------
  - name: "asesores"
    label: "Asesores"
    label_singular: "Asesor"
    description: "Perfiles de asesores de MAKOM Properties que se pueden asignar a una propiedad."
    folder: "content/asesores"
    create: true
    slug: "{{slug}}"
    format: "json"
    extension: "json"
    identifier_field: "nombre"
    summary: "{{nombre}} — {{cargo}}"
    editor:
      preview: false
    fields:
      - { label: "Nombre", name: "nombre", widget: "string" }
      - { label: "Cargo (ES)", name: "cargo", widget: "string", hint: "Ej.: Asesor inmobiliario · MAKOM Properties" }
      - { label: "Cargo (EN)", name: "cargoEn", widget: "string", required: false, hint: "Si se deja vacío se usa el cargo en español." }
      - { label: "Número de idoneidad", name: "idoneidad", widget: "string", required: false, hint: "Solo si aplica y está confirmado. Si se deja vacío, la tarjeta no muestra ninguna línea de idoneidad." }
      - { label: "WhatsApp (solo dígitos con código de país)", name: "whatsapp", widget: "string", required: false, pattern: ["^[0-9]{8,15}$", "Solo dígitos, con código de país y sin +, espacios ni guiones (ej. 50763534377)."], hint: "El botón de WhatsApp de la ficha usa ESTE número. Si se deja vacío, la tarjeta usa el WhatsApp corporativo de MAKOM." }
      - { label: "Foto", name: "foto", widget: "image", required: false, hint: "Opcional. Sin foto, la tarjeta muestra un monograma con las iniciales." }
